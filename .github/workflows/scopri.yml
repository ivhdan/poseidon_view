name: Scopri dataset

on:
  workflow_dispatch:
    inputs:
      prodotti:
        description: "ID prodotti Copernicus separati da spazio (vuoto = predefiniti)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  scopri:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - env:
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}
        run: python scripts/scopri.py ${{ github.event.inputs.prodotti }} | tee scopri.txt
      - name: Salva il risultato sul ramo "diagnostica"
        run: |
          git config user.name "poseidon-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mv scopri.txt /tmp/scopri.txt
          git checkout --orphan diagnostica
          git rm -rfq .
          cp /tmp/scopri.txt scopri.txt
          git add scopri.txt
          git commit -qm "Elenco dataset $(date -u +%F)"
          git push -f origin diagnostica
