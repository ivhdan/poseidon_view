<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Correnti del Mediterraneo &middot; Mito Sub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cinzel:wght@400;600&family=Crimson+Pro:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet-gesture-handling@1.2.2/dist/leaflet-gesture-handling.min.css">
<link rel="stylesheet" href="../assets/poseidon.css">
</head>
<body>

<div class="widget">

  <header class="w-head">
    <span class="anchor">&#9875;</span>
    <div class="w-title">
      <h1>Correnti marine</h1>
      <div class="sub">Superficie &middot; 10 giorni</div>
    </div>
    <span class="chip" id="date">&hellip;</span>
    <a class="btn-full" href="./" target="_blank" rel="noopener" title="Apri a schermo intero">&#10530;</a>
  </header>

  <nav class="days" aria-label="Giorno della previsione">
    <button class="play" id="play" type="button" title="Avvia la previsione">&#9654;</button>
    <div class="strip" id="strip"></div>
  </nav>

  <div class="w-body">
    <div id="map" class="map"></div>
    <div id="status" class="status"></div>
    <div id="legend" class="legend"></div>
  </div>

  <footer class="w-foot">
    <span>Tocca il mare per velocit&agrave; e direzione</span>
    <span>Dati: <a href="https://data.marine.copernicus.eu/product/MEDSEA_ANALYSISFORECAST_PHY_006_013" target="_blank" rel="noopener">Copernicus Marine</a></span>
  </footer>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/leaflet-gesture-handling@1.2.2/dist/leaflet-gesture-handling.min.js"></script>
<script src="../assets/poseidon.js"></script>
<script src="../assets/correnti-anim.js"></script>
<script>
(() => {
  const DATI = '../data/correnti/';
  const PASSO_PLAY_MS = 3500;            // durata di ogni giorno durante la riproduzione

  const statusEl = document.getElementById('status');
  const dateEl = document.getElementById('date');
  const strip = document.getElementById('strip');
  const playBtn = document.getElementById('play');

  const map = PV.makeMap('map');
  const anim = new Correnti.Animazione(map);
  let overlay = null;
  let giorni = [];
  let corrente = -1;
  const cache = new Map();

  PV.legend(document.getElementById('legend'), {
    title: 'Velocità della corrente', unit: 'm/s',
    min: 0, max: Correnti.V_MAX, colors: Correnti.RAMPA, ticks: [0, 0.2, 0.4, 0.6, 0.8]
  });

  /* ---- Etichette dei giorni ---- */

  const GG = ['dom', 'lun', 'mar', 'mer', 'gio', 'ven', 'sab'];
  function etichetta(iso, i) {
    const d = new Date(iso + 'T12:00:00Z');
    return { dw: i === 0 && iso === PV.isoDate(0) ? 'oggi' : GG[d.getUTCDay()], dn: d.getUTCDate() };
  }

  /* ---- Caricamento ---- */

  async function carica(i) {
    const g = giorni[i];
    if (!cache.has(g.file)) {
      cache.set(g.file, fetch(DATI + g.file, { cache: 'no-cache' })
        .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
        .then(j => new Correnti.Campo(j)));
    }
    return cache.get(g.file);
  }

  async function mostra(i) {
    if (i === corrente) return;
    corrente = i;
    strip.querySelectorAll('.day').forEach((b, k) => b.classList.toggle('on', k === i));
    const btn = strip.children[i];
    if (btn) btn.scrollIntoView({ block: 'nearest', inline: 'nearest' });
    try {
      const campo = await carica(i);
      if (i !== corrente) return;        // nel frattempo e' stato scelto un altro giorno
      const url = campo.image();
      if (overlay) overlay.setUrl(url);
      else overlay = L.imageOverlay(url, campo.bounds(), { opacity: 0.92, interactive: false }).addTo(map);
      anim.setCampo(campo);
      dateEl.textContent = PV.prettyDate(campo.data);
      PV.status(statusEl, '');
      if (i + 1 < giorni.length) carica(i + 1);   // precarica il giorno dopo
    } catch (e) {
      PV.status(statusEl, 'Dati del giorno non disponibili.');
    }
  }

  async function avvio() {
    PV.status(statusEl, 'Carico le correnti…');
    try {
      const r = await fetch(DATI + 'index.json', { cache: 'no-cache' });
      if (!r.ok) throw new Error(r.status);
      const idx = await r.json();
      // si parte da oggi: i giorni gia' passati non si mostrano
      const oggi = PV.isoDate(0);
      giorni = idx.giorni.filter(g => g.data >= oggi);
      if (!giorni.length) giorni = idx.giorni.slice(-1);
    } catch (e) {
      PV.status(statusEl, 'Dati in aggiornamento, riprova più tardi.');
      return;
    }

    giorni.forEach((g, i) => {
      const t = etichetta(g.data, i);
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'day';
      b.innerHTML = `<span class="dw">${t.dw}</span><span class="dn">${t.dn}</span>`;
      b.addEventListener('click', () => { ferma(); mostra(i); });
      strip.appendChild(b);
    });
    mostra(0);
  }

  /* ---- Riproduzione dei giorni ---- */

  let timer = null;
  function ferma() {
    clearInterval(timer); timer = null;
    playBtn.innerHTML = '&#9654;';
    playBtn.title = 'Avvia la previsione';
  }
  playBtn.addEventListener('click', () => {
    if (timer) { ferma(); return; }
    if (!giorni.length) return;
    playBtn.innerHTML = '&#10074;&#10074;';
    playBtn.title = 'Ferma';
    timer = setInterval(() => mostra((corrente + 1) % giorni.length), PASSO_PLAY_MS);
  });

  /* ---- Tocco sul mare: velocita' e direzione ---- */

  const ROSA = ['N', 'NE', 'E', 'SE', 'S', 'SO', 'O', 'NO'];
  map.on('click', async e => {
    if (corrente < 0) return;
    const campo = await carica(corrente);
    const vel = campo.at(e.latlng.lng, e.latlng.lat) || campo.nearest(e.latlng.lng, e.latlng.lat);
    const coord = PV.coord(e.latlng);
    let html;
    if (vel) {
      const s = Math.hypot(vel[0], vel[1]);
      const deg = (Math.atan2(vel[0], vel[1]) * 180 / Math.PI + 360) % 360;   // verso cui scorre
      html = `<b>${s.toFixed(2).replace('.', ',')} m/s</b> ` +
             `(${(s * 1.943844).toFixed(1).replace('.', ',')} nodi)<br>` +
             `verso ${ROSA[Math.round(deg / 45) % 8]} &middot; ${Math.round(deg)}&deg;<br>` +
             `<small>${coord}</small>`;
    } else {
      html = `<small>NESSUN DATO QUI</small><br><small>${coord}</small>`;
    }
    L.popup({ closeButton: false, autoPan: false }).setLatLng(e.latlng).setContent(html).openOn(map);
  });

  avvio();
})();
</script>
</body>
</html>
